<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    </style>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2457A7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Opaque Background -->
  <rect width="1280" height="640" fill="#0b1524"/>

  <!-- Outer subtle border -->
  <rect x="1" y="1" width="1278" height="638" rx="8" fill="none" stroke="#1e2e45" stroke-width="2"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1280" height="4" fill="url(#headerGrad)"/>

  <!-- Top metadata row -->
  <g transform="translate(60, 48)">
    <!-- Tag pill -->
    <rect x="0" y="0" width="389.5" height="28" rx="6" fill="#101e33" stroke="#2457A7" stroke-width="1.2"/>
    <text x="12" y="18" class="font-mono" font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="0.5px">MARTINI-LINEAR-PFAS · MARTINI 3 FORCE FIELD</text>

    <!-- Author & Institution -->
    <text x="1160" y="19" text-anchor="end" class="font-sans" font-size="15" font-weight="500" fill="#94a3b8">Alessandro Calza · University of Bologna</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="60" y="116" class="font-sans" font-size="32" font-weight="700" fill="#ffffff" letter-spacing="-0.5px">Martini 3 Models for Linear PFAS</text>
  <text x="60" y="148" class="font-sans" font-size="16" font-weight="400" fill="#94a3b8">Coarse-grained force field parameters, micelle self-assembly, and environmental simulation systems</text>

  <!-- Content Container Box -->
  <rect x="60" y="176" width="1160" height="420" rx="10" fill="#070e18" stroke="#1e2e45" stroke-width="1.5"/>

  <!-- Showcase Content -->
  <image href="../../LinearPFAS.png" x="75" y="186" width="1130" height="400" preserveAspectRatio="xMidYMid meet"/>

  <!-- Footer metadata line -->
  <circle cx="68" cy="616" r="3" fill="#2dd4bf"/>
  <text x="80" y="620" class="font-sans" font-size="14" font-weight="500" fill="#94a3b8">github.com/CalzaAlessandro/martini-linear-pfas</text>
  <text x="1220" y="620" text-anchor="end" class="font-mono" font-size="12" fill="#475569">1280 × 640</text>
</svg>